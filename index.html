<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHESS-IO — Play the Unbeatable AI</title>
<meta name="description" content="CHESS-IO: play chess against Stockfish, the world-champion engine, right in your browser. Four difficulties from friendly to grandmaster-killer." />
<link rel="stylesheet" href="css/style.css?v=1" />
<script type="importmap">
{ "imports": { "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js" } }
</script>
</head>
<body>

<header class="topbar">
  <div class="logo">♞ <b>CHESS-IO</b></div>
  <div class="engine-status" id="engineStatus"><span class="dot loading"></span><span id="engineText">Loading Stockfish…</span></div>
</header>

<main class="layout">

  <section class="board-col">
    <div class="player-bar" id="topBar">
      <div class="player-id"><span class="avatar">🤖</span><span id="topName">Stockfish</span><span class="diff-tag" id="diffTag">IMPOSSIBLE</span></div>
      <div class="captured" id="topCaptured"></div>
      <div class="clock" id="topClock">10:00</div>
    </div>

    <div class="board-frame">
      <div class="board" id="board" aria-label="Chess board"></div>
      <div class="thinking" id="thinking" hidden><span class="spinner"></span> Stockfish is thinking…</div>
    </div>

    <div class="player-bar" id="bottomBar">
      <div class="player-id"><span class="avatar">🧑</span><span id="bottomName">You</span></div>
      <div class="captured" id="bottomCaptured"></div>
      <div class="clock" id="bottomClock">10:00</div>
    </div>

    <div class="material-line" id="materialLine"></div>
  </section>

  <aside class="panel">
    <div class="status" id="status">Your move — White to play.</div>

    <div class="controls">
      <label>AI difficulty
        <select id="difficulty">
          <option value="easy">😊 Easy — learning mode</option>
          <option value="medium">🙂 Medium — club player</option>
          <option value="hard">😠 Hard — expert</option>
          <option value="impossible" selected>💀 Impossible — full Stockfish</option>
        </select>
      </label>
      <label>Play as
        <select id="colorPick">
          <option value="w" selected>White</option>
          <option value="b">Black</option>
        </select>
      </label>
      <label>Clock
        <select id="timePick">
          <option value="300">5 min</option>
          <option value="600" selected>10 min</option>
          <option value="900">15 min</option>
          <option value="0">No clock</option>
        </select>
      </label>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="newBtn">↺ New game</button>
      <button class="btn" id="undoBtn">⤺ Undo</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="hintBtn">💡 Hint</button>
      <button class="btn" id="flipBtn">⇄ Flip</button>
      <button class="btn danger" id="resignBtn">🏳 Resign</button>
    </div>

    <h3 class="moves-title">Moves</h3>
    <ol class="moves" id="moves"></ol>
  </aside>

</main>

<!-- promotion picker -->
<div class="modal" id="promoModal" hidden>
  <div class="modal-card">
    <h3>Promote to</h3>
    <div class="promo-choices" id="promoChoices"></div>
  </div>
</div>

<!-- game over -->
<div class="modal" id="overModal" hidden>
  <div class="modal-card">
    <div class="over-emoji" id="overEmoji">🏆</div>
    <h2 id="overTitle">Checkmate</h2>
    <p id="overSub">You win!</p>
    <button class="btn primary big" id="againBtn">Play again</button>
  </div>
</div>

<footer class="footer">
  <p>Engine: <b>Stockfish 10</b> (world-champion chess AI) running in your browser · Rules: <b>chess.js</b> · Crafted by <b>Aman Singh</b></p>
</footer>

<script type="module" src="js/game.js?v=1"></script>
</body>
</html>
